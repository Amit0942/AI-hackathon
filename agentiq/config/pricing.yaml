# Pricing guardrails (Phase 6). Placeholders until Steps 1.5/6.3 calibrate
# them against real price-driver evidence and the lost-leads price-gap curve.

price_band:
  floor_percentile: 0.10        # floor = 10th percentile of comparable realised prices
  margin_floor_pct: 0.05        # floor never dips below cost + 5% margin
  cap_price_gap_pct: 0.35       # cap set near the price-gap where lost-leads show deals dying

demand_multiplier:
  max_uplift_pct: 0.40          # single-factor uplift ceiling
  max_discount_pct: 0.25        # single-factor discount ceiling

recency_decay:
  # Half-life for pipeline/lead signal weight, in days. A lead this many
  # days old counts for half as much as a fresh one. Tune in Step 6.1.
  half_life_days: 21
  hard_cutoff: "lead_expiry_date"   # column-driven hard cutoff, never a magic constant

cold_start_ladder:
  # Ordered fallback rungs (Step 6.5), each with a stated confidence label.
  - rung: screen_own_history
    confidence: high
  - rung: peer_screens_same_location_or_corridor
    confidence: medium
  - rung: cohort_zone_type_position_size
    confidence: medium
  - rung: city_screen_type_baseline
    confidence: low
  - rung: global_rate_card
    confidence: low

human_overrides:
  # All human-supplied inputs are logged overrides, never silent edits.
  allowed_fields: [expected_footfall, strategic_discount_intent, competitive_intel]
