# Pricing guardrails (Phase 6). Calibrated against Step 1.5's measured
# price-driver evidence and lost-leads price-gap curve — no longer placeholders.

price_band:
  floor_percentile: 0.10        # floor = 10th percentile of comparable realised prices
  margin_floor_pct: 0.05        # floor never dips below cost + 5% margin
  # Two caps, because the +15%/+35% figures answer two different questions
  # (ADR-0003 decision 5, amended after the Phase 6 back-test quantified the
  # gap between them):
  #
  # 1. `cap_gap_pct_vs_client_target` — willingness-to-pay ceiling, measured
  #    in 1.5 §6.2: deals survive to verbal-agreement-or-later 38-48% of the
  #    time up to a 15% gap over the CLIENT'S TARGET PRICE, then collapse to
  #    7.7% (15-20%) and 3.5% (>20%). Used only when `client_target_price`
  #    is supplied to `PricingEngine.price()` (Step 6.4).
  #
  # 2. `cap_gap_pct_vs_base_rate` — used whenever no client target exists
  #    (today's default path, since no caller supplies one yet). The
  #    base-rate model has R^2=0.62 with $22.59 residual std (held-out,
  #    seed=0 split) — price varies around the model's prediction for
  #    reasons the model doesn't capture, which is a DIFFERENT and larger
  #    source of uncertainty than "how far a client will negotiate."
  #    Applying the 0.15 client-gap figure to this reference point back-
  #    tested at only 65.9% band coverage (24.4% of realised prices landed
  #    above cap) — the cap was rejecting real market prices as impossible.
  #    0.35 is the train-fit p90 of relative residuals (real/pred - 1),
  #    validated out-of-sample at ~10% above-cap on the held-out split.
  cap_gap_pct_vs_client_target: 0.15
  cap_gap_pct_vs_base_rate: 0.35

demand_multiplier:
  max_uplift_pct: 0.40          # single-factor uplift ceiling
  max_discount_pct: 0.25        # single-factor discount ceiling

recency_decay:
  # Half-life for pipeline/lead signal weight, in days. A lead this many
  # days old counts for half as much as a fresh one. Tune in Step 6.1.
  half_life_days: 21
  hard_cutoff: "lead_expiry_date"   # column-driven hard cutoff, never a magic constant

cold_start_ladder:
  # Ordered fallback rungs (Step 6.5), each with a stated confidence label.
  - rung: screen_own_history
    confidence: high
  - rung: peer_screens_same_location_or_corridor
    confidence: medium
  - rung: cohort_zone_type_position_size
    confidence: medium
  - rung: city_screen_type_baseline
    confidence: low
  - rung: global_rate_card
    confidence: low

human_overrides:
  # All human-supplied inputs are logged overrides, never silent edits (Step 6.6).
  allowed_fields: [expected_footfall, strategic_discount_intent, competitive_intel]
  # expected_footfall: compared against the D1 model's own exposure estimate;
  # the resulting relative delta adjusts target/recommended, clamped by the
  # SAME single-factor guardrail as the Step 6.1 demand multiplier above
  # (demand_multiplier.max_uplift_pct / max_discount_pct) so a rep's footfall
  # claim cannot run away any further than the model's own demand signal can.
  #
  # strategic_discount_intent: a closed vocabulary, not a free-form number —
  # a rep states intent, not a price, and the engine converts it to a bounded
  # discount (still capped by demand_multiplier.max_discount_pct).
  strategic_discount_pct:
    none: 0.0
    moderate: 0.10
    aggressive: 0.20
  # competitive_intel: presence of a non-empty note shrinks the cap's margin
  # above target. 0.148 = 3.4% / 22.9%, the Step 1.5 §6.5 measured ratio of
  # competitor-named vs. no-competitor price-gap survival at loss — a real
  # measured figure, not an invented shrink constant.
  competitive_intel_cap_shrink: 0.148

footfall_forecast:
  # Step 6.2: confidence interval width, in standard deviations of the
  # location/corridor's own observed day-to-day ridership variability
  # (measured from ridership_actuals, not assumed) — a +-1 sigma band.
  std_dev_multiplier: 1.0
  # Gap closed (docs/decisions/1.8_holiday_ridership_effect.md):
  # pricing/holidays.py computes the real US federal calendar (all three
  # cities' configured timezones are real US zones; applied uniformly since
  # these are fictional cities with no distinct state calendar to model —
  # a stated assumption, unlike the multiplier below).
  holiday_calendar_available: true
  # Measured, not assumed: mean ridership_actuals.actual_ridership on holiday
  # rows / non-holiday rows, network-wide (19,838 holiday rows / 2,049,632
  # total). Tested for differentiation by nearby POI type and by zone
  # dominant_occupation — none found (0.540-0.550 across every category on
  # 20k-100k-row samples each per the decision doc) — one global multiplier
  # is the measured, honest choice, not a simplification.
  holiday_ridership_multiplier: 0.5433
