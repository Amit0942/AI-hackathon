# Controlled vocabulary for semantic audience/environment labelling (Phase 3.3)
# and industry->affinity mapping (Phase 5.2). The Step 3.3 LLM agent may only
# assign labels from this list — anything else is dropped, not invented.
#
# poi_type values below are taken verbatim from points_of_interest.csv.
# environment_type values are derived from the language used across the six
# supplied campaign briefs (Step 1.8) — extend this list as new briefs arrive,
# never invent ad hoc labels inline in code.

poi_types:
  - corporate_campus
  - entertainment_district
  - government_building
  - grocery_anchor
  - hospital
  - hotel_convention
  - museum
  - office_park
  - residential_tower
  - shopping_mall
  - stadium_arena
  - tourist_landmark
  - university

environment_types:
  - business_district_platform
  - auto_retail_arterial_corridor
  - nightlife_entertainment_corridor
  - campus_edge_transit_node
  - event_venue_precinct
  - premium_mall_entry
  - high_street_retail_corridor
  - hyperlocal_walking_radius
  - airport_transit_corridor
  - premium_business_core
  - financial_district_node
  - mall_beauty_retail_entry
  - central_metro_entry

industries:
  - auto
  - cpg
  - education
  - entertainment
  - finance
  - government
  - healthcare
  - hospitality
  - nonprofit
  - real_estate
  - retail
  - technology
  - telecom

# industry -> preferred environment_types, used as a Step 5.2 objective_fit
# prior. Placeholder mapping — refine once Step 1.5 shows which cuts of
# historical bookings actually correlate with which industries.
industry_environment_affinity:
  auto: [auto_retail_arterial_corridor, business_district_platform]
  cpg: [nightlife_entertainment_corridor, campus_edge_transit_node, event_venue_precinct]
  entertainment: [event_venue_precinct, nightlife_entertainment_corridor]
  finance: [business_district_platform, financial_district_node, premium_business_core]
  healthcare: [hyperlocal_walking_radius, central_metro_entry]
  hospitality: [airport_transit_corridor, premium_business_core]
  retail: [premium_mall_entry, high_street_retail_corridor, mall_beauty_retail_entry]
  technology: [business_district_platform, premium_business_core]
  telecom: [business_district_platform, campus_edge_transit_node]
  education: [campus_edge_transit_node]
  government: [business_district_platform, government_building]
  real_estate: [business_district_platform, premium_mall_entry]
  nonprofit: [central_metro_entry, high_street_retail_corridor]

# Phase 4 (Step 4.2) brief-resolution rules — see docs/decisions/0005-phase4-
# brief-resolution-scope.md for the reasoning behind every rule below. Every
# entry here is traced to language in the six real briefs (docs/briefs/*.md
# in the Step 1.8 gold parses), never invented ad hoc in code.
brief_resolution:
  # (keyword substring, resolved value) pairs, checked case-insensitively
  # against `industry_vertical_raw`. Ordered most-specific first; the FIRST
  # matching keyword wins. A brief whose raw text matches none of these
  # falls back to `default_industry_vertical` and is flagged unresolved.
  industry_vertical_keywords:
    - ["electric vehicle", "auto"]
    - ["automotive", "auto"]
    - ["fmcg", "cpg"]
    - ["beverage", "cpg"]
    - ["fashion", "retail"]
    - ["apparel", "retail"]
    - ["beauty", "retail"]
    - ["personal care", "retail"]
    - ["cosmetic", "retail"]
    - ["food & beverage", "hospitality"]
    - ["qsr", "hospitality"]
    - ["restaurant", "hospitality"]
    - ["travel", "hospitality"]
    - ["aviation", "hospitality"]
    - ["airline", "hospitality"]
    - ["retail", "retail"]
    - ["technology", "technology"]
    - ["finance", "finance"]
    - ["healthcare", "healthcare"]
    - ["education", "education"]
    - ["telecom", "telecom"]
    - ["government", "government"]
    - ["real estate", "real_estate"]
    - ["nonprofit", "nonprofit"]
    - ["entertainment", "entertainment"]
  default_industry_vertical: retail

  # Same shape as above, but matched by EARLIEST position of the keyword in
  # the raw text (not first-in-list) — the six real briefs all state a
  # compound objective ("X & Y"), and the one stated first is the primary.
  objective_keywords:
    - ["awareness", "awareness"]
    - ["footfall", "conversion"]
    - ["recall", "awareness"]
    - ["trial", "conversion"]
    - ["purchase", "conversion"]
    - ["booking", "conversion"]
    - ["launch", "awareness"]
    - ["frequency", "frequency"]
    - ["reach", "reach"]
  default_objective: awareness

  # Free-text location-requirement LABEL (the bold heading before the colon
  # in Digital Screen Selection & Location Requirements) -> environment_type.
  # Built to match the six real briefs' own labels, per HANDOFF.md's note
  # that config/taxonomy.yaml's environment_types list was itself derived
  # from this language 1:1.
  location_label_environment_types:
    "High-Dwell Business-District Platforms": business_district_platform
    "Auto-Retail Arterial Corridors": auto_retail_arterial_corridor
    "Nightlife and Entertainment Corridors": nightlife_entertainment_corridor
    "Campus-Edge Transit Nodes": campus_edge_transit_node
    "Event-Venue Precincts": event_venue_precinct
    "Premium Mall Entry Points": premium_mall_entry
    "High-Street Retail Corridors": high_street_retail_corridor
    "Immediate Walking Radius of the New Outlet": hyperlocal_walking_radius
    "Midday Commercial-District Coverage": business_district_platform
    "Airport Transit Corridor": airport_transit_corridor
    "Premium Business Core": premium_business_core
    "Financial District Coverage": financial_district_node
    "Mall Beauty-Retail Entry": mall_beauty_retail_entry
    "Central Metro Entry Coverage": central_metro_entry

  # Exclusion/location free text -> a screen_type_exclusions rule in
  # CampaignBrief's own "type" or "type:position" convention.
  screen_exclusion_phrases:
    "bus-rear": "bus:back"
    "bus rear": "bus:back"

  # A brief's exclusion text naming this phrase triggers the value-tier /
  # high-density-residential zone proxy (Step 1.8's "no within-city
  # inventory tier anywhere in the schema" finding) rather than a literal
  # market_tier lookup, which is city-grain only.
  value_tier_residential_trigger_phrases: ["value-tier", "value tier"]
  value_tier_residential_income_index_max: 100.0
  value_tier_residential_density_min: 6000

  # Daypart language -> `time_block_id`s (dim_slot: 1=night 00-04, 2=morning
  # 04-08, 3=midday 08-12, 4=afternoon 12-16, 5=evening 16-20, 6=night
  # 20-24). "midday"/"lunch" deliberately maps to block 4, not block 3 —
  # dim_slot's own "midday" label (08-12) is too early for a stated
  # lunch-hour window; block 4 (12-16) is the defensible single-block buy
  # (docs/briefs/campaign_4.md §5.2).
  daypart_keywords:
    "late evening": [6]
    "early morning": [1]
    "lunch": [4]
    "midday": [4]
    "friday evening": [5]

  # Weekend/weekday weighting language -> `weekend_weighting` (fraction of
  # exposure weight biased toward weekend dayparts). Two tiers: an explicit
  # "weekend weighting" statement is fully weekend-biased; a softer
  # "ahead of the weekend" mention is a partial bias, not a firm request.
  weekend_weighting_strong_phrases: ["weekend weighting", "friday evening through sunday"]
  weekend_weighting_strong_value: 1.0
  weekend_weighting_soft_phrases: ["weekend shopping", "ahead of the weekend"]
  weekend_weighting_soft_value: 0.5

  # Step 4.3 default when a brief's outlet/anchor POI is named only by type
  # (e.g. "a business-park food court") with no identifying name: pick the
  # single highest-`est_daily_footfall` POI of the stated type(s) in the
  # resolved city, and narrow to *its zone* (GeographyConstraint has no
  # location-level field, so a zone is the finest hard-filter granularity
  # available — a stated approximation, not a true walking radius).
  hyperlocal_outlet_poi_types: [office_park, corporate_campus]
  hyperlocal_radius_km_default: 0.5
